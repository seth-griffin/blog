{% extends "layout.html" %}
{% block title %} Seth Griffin | {{ post.title }} {% endblock %}
{% block content %}
<div class="wrapper">
    <article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">
        <header class="post-header">
            <h1 class="post-title p-name" itemprop="name headline">{{ post.title }}</h1>
            <p class="post-meta">
                <time class="dt-published" datetime="{{ posted_on_iso_8601 }}" itemprop="datePublished">
                    {{ posted_on_mm_dd_YYYY }}
                </time>
            </p>
        </header>
    <div class="post-content e-content" itemprop="articleBody">
    <h1 id="{{ post.title | replace(' ', '-') | lower }}">{{ post.title }}</h1>
    {{ post.content|safe }}
{% endblock %}
